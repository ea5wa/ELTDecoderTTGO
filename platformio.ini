; ELT Decoder TTGO - Decodificador de balizas COSPAS-SARSAT 406 MHz
; Hardware: LilyGo T-Beam v1.2 (version 433 MHz, SX1278 + AXP2101) + OLED SSD1306

[platformio]
default_envs = tbeam

[env:tbeam]
platform = espressif32@6.7.0
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@^6.6.0
    lewisxhe/XPowersLib@^0.2.6
    olikraus/U8g2@^2.35.19
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Entorno nativo solo para los tests unitarios del decodificador:
;   pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
